services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.$DOMAIN_NAME/metasploit
    tty: true
  db:
    image: postgres:12.6-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: db
    volumes:
      - db:/var/lib/postgresql/data
volumes:
  db:
