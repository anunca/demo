services:
  web:
    image: demo/caddy-web:dev
    build:
      target: dev
    volumes:
      - ./etc/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./src:/srv
  app:
    image: demo/caddy-app:dev
    build:
      target: dev
    volumes:
      - ./etc/php/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
      - ./src:/srv
