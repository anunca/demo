services:

  elasticsearch:
    healthcheck:
      test: curl --fail http://localhost:9200 || exit 1
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    depends_on:
      elasticsearch:
        condition: service_healthy
    build:
      args:
        PYTHON_IMAGE:
      target: prod
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    depends_on:
      app:
        condition: service_healthy
    image: ${NGINX_IMAGE}
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./etc/nginx/proxy.conf:/etc/nginx/proxy.conf
