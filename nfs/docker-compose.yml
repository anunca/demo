version: '3.7'
services:
  server:
    image: anunca/nfs-server
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        UBUNTU_VERSION:
        NFS_DIRECTORY:
        NFS_HOST:
        NFS_OPTIONS:
    # cap_add:
    #   - ALL
    privileged: true
    ports:
      - 2049
    volumes:
      - data:$NFS_DIRECTORY
    environment:
      NFS_DIRECTORY:
      NFS_HOST:
      NFS_OPTIONS:
  server-alpine:
    image: anunca/nfs-server-alpine
    build:
      context: .
      dockerfile: Dockerfile.alpine
      args: 
        ALPINE_VERSION:
        NFS_DIRECTORY:
        NFS_HOST:
        NFS_OPTIONS:
    # cap_add:
    #   - ALL
    privileged: true
    ports:
      - 2049
    volumes:
      - data:$NFS_DIRECTORY
    environment:
      NFS_DIRECTORY:
      NFS_HOST:
      NFS_OPTIONS:
volumes: 
  data: