agent:
  download:
    sourceURI: 'https://artifacts.elastic.co/downloads/'
  monitoring:
    enabled: true
    use_output: default
    namespace: default
    logs: true
    metrics: true
  features: {}
inputs:
  - id: logfile-system-d55fb456-0619-4638-a37f-565ae073c5a8
    name: system-1
    revision: 1
    type: logfile
    use_output: default
    meta:
      package:
        name: system
        version: 1.25.2
    data_stream:
      namespace: default
    package_policy_id: d55fb456-0619-4638-a37f-565ae073c5a8
    streams:
      - id: logfile-system.auth-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.auth
          type: logs
        ignore_older: 72h
        paths:
          - /var/log/auth.log*
          - /var/log/secure*
        exclude_files:
          - .gz$
        multiline:
          pattern: ^\s
          match: after
        tags:
          - system-auth
        processors:
          - add_locale: null
      - id: logfile-system.syslog-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.syslog
          type: logs
        paths:
          - /var/log/messages*
          - /var/log/syslog*
        exclude_files:
          - .gz$
        multiline:
          pattern: ^\s
          match: after
        processors:
          - add_locale: null
        ignore_older: 72h
  - id: winlog-system-d55fb456-0619-4638-a37f-565ae073c5a8
    name: system-1
    revision: 1
    type: winlog
    use_output: default
    meta:
      package:
        name: system
        version: 1.25.2
    data_stream:
      namespace: default
    package_policy_id: d55fb456-0619-4638-a37f-565ae073c5a8
    streams:
      - id: winlog-system.application-d55fb456-0619-4638-a37f-565ae073c5a8
        name: Application
        data_stream:
          dataset: system.application
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
      - id: winlog-system.security-d55fb456-0619-4638-a37f-565ae073c5a8
        name: Security
        data_stream:
          dataset: system.security
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
      - id: winlog-system.system-d55fb456-0619-4638-a37f-565ae073c5a8
        name: System
        data_stream:
          dataset: system.system
          type: logs
        condition: '${host.platform} == ''windows'''
        ignore_older: 72h
  - id: system/metrics-system-d55fb456-0619-4638-a37f-565ae073c5a8
    name: system-1
    revision: 1
    type: system/metrics
    use_output: default
    meta:
      package:
        name: system
        version: 1.25.2
    data_stream:
      namespace: default
    package_policy_id: d55fb456-0619-4638-a37f-565ae073c5a8
    streams:
      - id: system/metrics-system.cpu-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.cpu
          type: metrics
        metricsets:
          - cpu
        cpu.metrics:
          - percentages
          - normalized_percentages
        period: 10s
      - id: system/metrics-system.diskio-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.diskio
          type: metrics
        metricsets:
          - diskio
        diskio.include_devices: null
        period: 10s
      - id: system/metrics-system.filesystem-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.filesystem
          type: metrics
        metricsets:
          - filesystem
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.filesystem.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.fsstat-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.fsstat
          type: metrics
        metricsets:
          - fsstat
        period: 1m
        processors:
          - drop_event.when.regexp:
              system.fsstat.mount_point: ^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)
      - id: system/metrics-system.load-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.load
          type: metrics
        metricsets:
          - load
        condition: '${host.platform} != ''windows'''
        period: 10s
      - id: system/metrics-system.memory-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.memory
          type: metrics
        metricsets:
          - memory
        period: 10s
      - id: system/metrics-system.network-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.network
          type: metrics
        metricsets:
          - network
        period: 10s
        network.interfaces: null
      - id: system/metrics-system.process-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.process
          type: metrics
        metricsets:
          - process
        period: 10s
        process.include_top_n.by_cpu: 5
        process.include_top_n.by_memory: 5
        process.cmdline.cache.enabled: true
        process.cgroups.enabled: false
        process.include_cpu_ticks: false
        processes:
          - .*
      - id: >-
          system/metrics-system.process.summary-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.process.summary
          type: metrics
        metricsets:
          - process_summary
        period: 10s
      - id: >-
          system/metrics-system.socket_summary-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.socket_summary
          type: metrics
        metricsets:
          - socket_summary
        period: 10s
      - id: system/metrics-system.uptime-d55fb456-0619-4638-a37f-565ae073c5a8
        data_stream:
          dataset: system.uptime
          type: metrics
        metricsets:
          - uptime
        period: 10s
  - id: logfile-apache-28e8bf9e-a0ab-429a-b73f-59cc8fde7a46
    name: apache-1
    revision: 1
    type: logfile
    use_output: default
    meta:
      package:
        name: apache
        version: 1.10.0
    data_stream:
      namespace: default
    package_policy_id: 28e8bf9e-a0ab-429a-b73f-59cc8fde7a46
    streams:
      - id: logfile-apache.access-28e8bf9e-a0ab-429a-b73f-59cc8fde7a46
        data_stream:
          dataset: apache.access
          type: logs
        paths:
          - /var/log/apache2/access.log*
          - /var/log/apache2/other_vhosts_access.log*
          - /var/log/httpd/access_log*
        tags:
          - apache-access
        exclude_files:
          - .gz$
      - id: logfile-apache.error-28e8bf9e-a0ab-429a-b73f-59cc8fde7a46
        data_stream:
          dataset: apache.error
          type: logs
        paths:
          - /var/log/apache2/error.log*
          - /var/log/httpd/error_log*
        exclude_files:
          - .gz$
        tags:
          - apache-error
        processors:
          - add_locale: null
  - id: apache/metrics-apache-28e8bf9e-a0ab-429a-b73f-59cc8fde7a46
    name: apache-1
    revision: 1
    type: apache/metrics
    use_output: default
    meta:
      package:
        name: apache
        version: 1.10.0
    data_stream:
      namespace: default
    package_policy_id: 28e8bf9e-a0ab-429a-b73f-59cc8fde7a46
    streams:
      - id: apache/metrics-apache.status-28e8bf9e-a0ab-429a-b73f-59cc8fde7a46
        data_stream:
