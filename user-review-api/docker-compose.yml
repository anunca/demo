version: '3.7'
services:
    app:
        depends_on: 
            - db
        image: local/api:user-review
        build: 
            context: .
            args: 
                NODE_VERSION:
        volumes: 
            - ./src:/app
            - node_modules:/app/node_modules
            - ~/.aws:/root/.aws
        environment: 
            SLS_DEBUG:
            DYNAMODB_URL:
        ports: 
            - "3000:3000"
    db:
        image: $DYNAMODB_VERSION
        volumes: 
            - db:/home/dynamodblocal
        ports: 
            - "8000:8000"
        command: -jar DynamoDBLocal.jar -sharedDb -dbPath '.'
volumes:
    node_modules:
    db: