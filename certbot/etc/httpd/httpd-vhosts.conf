<VirtualHost *:80>
    ServerName appdemo.name
    ServerAlias *.appdemo.name

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName appdemo.name
    ServerAlias *.appdemo.name

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/appdemo.name/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/appdemo.name/privkey.pem

    DocumentRoot /var/www/html
    DirectoryIndex index.html

    ErrorLog logs/appdemo.name-error.log
    CustomLog logs/appdemo.name-access.log combined

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
