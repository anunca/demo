version: '3.7'
services:
  app:
    depends_on: 
      - db
    image: anunca/demo:serverless-node
    build: 
      context: .
      args: 
        NODE_VERSION:
    ports: 
      - 3000:3000
    volumes: 
      - ./src:/app
      - node_modules:/app/node_modules
      - ~/.aws:/root/.aws
    environment: 
      SLS_DEBUG:
      DYNAMODB_URL:
  db:
    image: $DYNAMODB_VERSION
    ports: 
      - 8000:8000
    volumes: 
      - db:/data/db
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data/db
  swagger:
    image: $SWAGGER_VERSION
    ports: 
      - 8080:8080
    volumes: 
      - ./src/doc:/doc
    environment: 
      SWAGGER_JSON: /doc/swagger.yml
volumes:
  db:
  node_modules:
