name: Auto-Assign by Label

on:
  pull_request:
    types: [labeled]

jobs:
  assign-by-label:
    runs-on: ubuntu-24.04
    steps:
      - name: Assign users based on label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = context.payload.label?.name;
            const pr = context.payload.pull_request;
            const issue_number = pr?.number;
            const repo = context.repo;

            if (!label || !issue_number) {
              console.log("No valid PR or label detected.");
              return;
            }

            const labelToAssignees = {
              "good_movie": ["anunca"],
              "bad_movie": ["jdoe"],
            };

            const assignees = labelToAssignees[label];

            if (assignees) {
              console.log(`Assigning ${assignees.join(", ")} for label "${label}" on PR #${issue_number}.`);
              await github.rest.issues.addAssignees({
                ...repo,
                issue_number,
                assignees
              });
            } else {
              console.log(`No assignees defined for label "${label}".`);
            }
