server {
    listen 80;
    listen 443 ssl;
    http2 on; # Enable HTTP/2
    listen 443 quic reuseport; # Enable HTTP/3
    server_name appdemo.name;

    ssl_certificate /etc/nginx/certs/appdemo.name.crt;  # Path to your SSL certificate
    ssl_certificate_key /etc/nginx/certs/appdemo.name.key;  # Path to your SSL key

    # Enable QUIC
    ssl_protocols       TLSv1.3;  # HTTP/3 only supports TLS 1.3
    ssl_prefer_server_ciphers off; 
    ssl_session_cache shared:SSL:10m;
    add_header Alt-Svc 'h3-23=":443"'; # Advertise HTTP/3 support

    # Root directory for your website
    root /usr/share/nginx/html;

    # Index files
    index index.php index.html index.htm;

    # # Cache static files for 1 month on the server and 24 hours in the browser
    # location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
    #     expires 24h;                     # Set browser cache to 24 hours
    #     add_header Cache-Control "public";
    #     access_log off;
    #     try_files $uri $uri/ =404;
    # }

    # PHP configuration (you need to add PHP-FPM container if you want to run PHP)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Static file caching on server (1 month)
    location / {
        try_files $uri $uri/ =404;
    }

    # Disable access to hidden files like .htaccess
    location ~ /\.ht {
        deny all;
    }
}
