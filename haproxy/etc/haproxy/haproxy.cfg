# Global settings
global
    log /dev/log    local0
    log /dev/log    local1 notice
    maxconn 10000

# Default settings
defaults
    log     global
    option  httplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    mode http

# Define HAProxy Cache for Static Files
cache static_cache
    total-max-size 512
    max-object-size 10000
    max-age 86400

# Frontend configuration
frontend http_front
    bind *:80
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/appdemo.name.pem alpn h2,http/1.1
    #TODO http3
    # bind *:443 quic
    

    # Use ACL to route static assets (JS, CSS, images) through cache
    acl is_static path_end .jpg .jpeg .png .gif .ico .css .js .woff .woff2 .ttf .eot .svg

    http-response set-header Cache-Control "public, max-age=31536000, immutable"

    use_backend cache_static if is_static

    default_backend nginx_servers

# Backend for static files served from cache
backend cache_static
    balance roundrobin

    http-request cache-use static_cache

    http-response cache-store static_cache
    http-response set-header Expires %[date(31536000),http_date]
    http-response set-header ETag %[unique-id]

    # Shorter cache for CSS/JS (to allow updates)
    # TODO check why acl does not work
    # acl is_css_js path_end .css .js
    # http-response set-header Cache-Control "public, max-age=604800" if is_css_js

    compression algo gzip deflate
    compression type text/css text/javascript application/javascript application/json application/xml

    server nginx1 nginx1:80 check
    server nginx2 nginx2:80 check

# Backend for Nginx (PHP and dynamic content)
backend nginx_servers
    balance roundrobin

    # Force revalidation for HTML (so users always get the latest version)
    # TODO check why acl does not work
    # acl is_html path_end .html
    # http-response set-header Cache-Control "no-cache, must-revalidate" if is_html

    compression algo gzip deflate
    compression type text/html

    server nginx1 nginx1:80 check
    server nginx2 nginx2:80 check

# Optional HAProxy Stats page
listen stats
    bind *:8080
    stats enable
    stats uri /haproxy?stats
    stats realm HAProxy\ Statistics
    stats auth admin:admin
