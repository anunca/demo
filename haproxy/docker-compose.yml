services:
  haproxy:
    image: demo/haproxy:dev
    build:
      target: dev
    volumes:
      - ./etc/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
      - ./etc/nginx/certs/:/usr/local/etc/haproxy/certs/
  nginx1:
    image: demo/haproxy-nginx:dev
    build:
      target: dev
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./etc/nginx/certs/:/etc/nginx/certs/
      - ./src:/usr/share/nginx/html
  nginx2:
    image: demo/haproxy-nginx:dev
    build:
      target: dev
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./etc/nginx/certs/:/etc/nginx/certs/
      - ./src:/usr/share/nginx/html
  php:
    image: demo/haproxy-php:dev
    build:
      target: dev
    volumes:
      - ./src:/usr/share/nginx/html
