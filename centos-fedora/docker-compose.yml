services:
    master1:
        image: registry.$DOMAIN_NAME/master1
        build:
            context: .
            dockerfile: Dockerfile.master
        volumes:
            - /sys/fs/cgroup:/sys/fs/cgroup:ro
            - ./multipass:/root/multipass
        privileged: true
        working_dir: /root/multipass
    node1:
        depends_on:
            - master1
        image: registry.$DOMAIN_NAME/node1
        build:
            context: .
            dockerfile: Dockerfile.node
        volumes:
            - /sys/fs/cgroup:/sys/fs/cgroup:ro
            - ./multipass:/root/multipass
        privileged: true
        working_dir: /root/multipass
