version: '3.7'
services:
  web:
    depends_on:
      - app
    image: $NGINX_VERSION
    volumes:
      - ./etc/nginx.conf:/etc/nginx/conf.d/default.conf
      - php_run:/var/run/php
    ports:
      - "80:80"
  app:
    build:
      context: .
      dockerfile: $DOCKER_FILE
      args:
        PHP_VERSION: $PHP_VERSION
    # env_file:
    #   - .env
    volumes:
      - ./etc/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
      - php_run:/var/run/php
    # ports:
    #   - "80:80"
volumes:
  php_run: