- hosts: all
  become: yes
  tasks:
    - name: Run the equivalent of "apt-get update" as a separate step
      apt:
        update_cache: yes
    
    #docker and kubernetes
    - name: install apt-transport-https
      apt:
        name: apt-transport-https
        state: latest
        update_cache: yes

    #docker only
    - name: install ca-certificates
      apt:
        name: ca-certificates
        state: latest

    - name: install curl
      apt:
        name: curl
        state: latest

    - name: install gnupg-agent
      apt:
        name: gnupg-agent
        state: latest

    - name: install software-properties-common
      apt:
        name: software-properties-common
        state: latest

    - name: add Docker apt-key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: add Docker apt repository
      apt_repository:
        #ubuntu bionic 18.04
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu bionic stable
        state: present
        filename: docker
        update_cache: yes

    #https://v1-14.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/
    #https://v1-17.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/
    #https://v1-14.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/#docker
    #https://v1-17.docs.kubernetes.io/docs/setup/production-environment/container-runtimes/#docker
    - name: install docker-ce 
      apt:
        update_cache: yes
        pkg:
          #ubuntu bionic 18.04 version
          #K8S >=1.14<=1.16
          - docker-ce=18.06.3~ce~3-0~ubuntu
          #K8S >=1.17
          # - docker-ce=5:19.03.8~3-0~ubuntu-bionic
        state: present

    # - name: install docker-ce-cli
    #   apt:
    #     update_cache: yes
    #     pkg:
    #       #ubuntu bionic 18.04 version
    #       #K8S >=1.17
    #       - docker-ce-cli=5:19.03.8~3-0~ubuntu-bionic
    #     state: present
    
    # - name: install containerd.io
    #   apt:
    #     update_cache: yes
    #     pkg:
    #       #ubuntu bionic 18.04 version
    #       #K8S >=1.17
    #       - containerd.io=1.2.13-1
    #     state: present

    #cannot use overlay2 with lxc container unprivileged
    - name: config docker daemon
      shell:
        cmd: |
          cat > /etc/docker/daemon.json <<EOF
          {
            "exec-opts": ["native.cgroupdriver=systemd"],
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "100m"
            },
            "storage-driver": "overlay"
          }
          EOF
      args:
        executable: /bin/bash

    - name: create docker.service.d directory
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory

    - name: restart service daemon_reload
      systemd: daemon_reload=yes

    - name: restart service docker
      service:
        name: docker
        state: restarted

    - name: adding existing user "{{ ansible_user }}" to group docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: adding existing user "ubuntu" to group docker
      user:
        name: "ubuntu"
        groups: docker
        append: yes

    #kubernetes only
    - name: update iptables for Flannel
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: '1'
        sysctl_set: yes
        state: present
        reload: yes

    - name: stop and disable service ufw
      service:
        name: ufw
        state: stopped
        enabled: no

    - name: linux image (for lxd only)
      apt:
        name: linux-image-5.3.0-46-generic
        state: present

    - name: add Kubernetes apt-key
      apt_key:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        state: present

    - name: add Kubernetes apt repository
      apt_repository:
        #ubuntu xenial 16.04
        repo: deb https://apt.kubernetes.io/ kubernetes-xenial main
        state: present
        filename: kubernetes
        update_cache: yes

    - name: install kubeadm, kubelet, kubectl
      apt:
        update_cache: yes
        pkg:
          #ubuntu xenial 16.04
          #1.11.10-00
          #1.14.10-00, 1.15.11-00, 1.16.8-00, 1.17.4-00, 1.18.0-00
          - kubeadm=1.14.10-00
          - kubelet=1.14.10-00
          - kubectl=1.14.10-00
        state: present