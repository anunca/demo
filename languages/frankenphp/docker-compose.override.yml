services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRANKENPHP_BUILDER_IMAGE:
        FRANKENPHP_IMAGE:
    volumes:
      # - ~/.aws:/root/.aws
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
  redis:
    image: $REDIS_IMAGE
    ports:
      - 6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
volumes:
  caddy_data:
  caddy_config:
  redis_data:
