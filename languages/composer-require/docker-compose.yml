services:
  php:
    build:
      target: $ENV
    image: $COMPOSER_REQUIRE_PHP_IMAGE:$ENV
    volumes:
      - ./src:/usr/share/nginx/html
  nginx:
    image: $COMPOSER_REQUIRE_NGINX_IMAGE:$ENV
    build:
      target: $ENV
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/usr/share/nginx/html
