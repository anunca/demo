services:
  haproxy:
    env_file:
      - .env
    build:
      context: .
      dockerfile: $DOCKERFILE
      args:
        HAPROXY_VERSION:
    image: $IMAGE
    volumes:
      - ./etc/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - 80
      # - 443:443
    restart: unless-stopped
